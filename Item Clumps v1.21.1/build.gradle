plugins {
    id 'fabric-loom' version '1.10.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    flatDir {
        dirs 'e:/Minecraft Project/Dasik Library v1.21.1/Archive Jar of all versions/MC 1.21.1'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Standalone Library
    modImplementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    // Optional GUI Integration
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly("dev.isxander:yet-another-config-lib:3.5.0+1.21-fabric") {
        transitive = false
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

loom {
    mixin {
        defaultRefmapName = "item-clumps-refmap.json"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version,
               "minecraft_dependency": project.minecraft_dependency
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveBaseName = project.archives_base_name
    from("LICENSE") {
        rename { String name -> name + "_" + project.archives_base_name }
    }
    manifest {
        attributes(
            'Implementation-Title': project.archives_base_name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor': 'Dasik (Rifaditya)',
            'X-Origin-Author': 'Dasik (Rifaditya)',
            'X-Origin-Repository': 'https://github.com/Rifaditya',
            'X-Origin-License': 'GNU GPLv3'
        )
    }
}

remapJar {
    archiveBaseName = project.archives_base_name
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Copies release JAR to local Archive, Central Release Hub, and External Vault'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (jarFile.exists()) {
                    // 1. Mod Local Archive
                    def mcVer = project.findProperty('minecraft_version') ?: ''
                    def localArchiveDir = file(mcVer ? "../Archive Jar of all versions/MC ${mcVer}" : "../Archive Jar of all versions")
                    if (localArchiveDir.exists() || localArchiveDir.parentFile?.exists()) {
                        localArchiveDir.mkdirs()
                        copy {
                            from jarFile
                            into localArchiveDir
                        }
                        println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to local Archive: ${localArchiveDir.canonicalPath}"
                    }

                    // 2. Central Release Hub Archives Sync
                    File hubCandidate = projectDir
                    File hubDir = null
                    while (hubCandidate != null) {
                        File checkDir = new File(hubCandidate, "minecraft-mod-release-hub")
                        if (checkDir.exists()) {
                            hubDir = checkDir
                            break
                        }
                        hubCandidate = hubCandidate.parentFile
                    }
                    if (hubDir == null) {
                        File fallback = new File("E:/Minecraft Project/minecraft-mod-release-hub")
                        if (fallback.exists()) hubDir = fallback
                    }
                    if (hubDir != null && hubDir.exists()) {
                        File hubConfigFile = new File(hubDir, "config/platform_projects.json")
                        if (hubConfigFile.exists()) {
                            try {
                                def hubJson = new groovy.json.JsonSlurper().parse(hubConfigFile)
                                def curPath = projectDir.canonicalPath.replace('\\', '/').toLowerCase()
                                def matchedMod = hubJson.find { name, data ->
                                    data.root_dir && curPath.contains(data.root_dir.replace('\\', '/').toLowerCase())
                                }?.key
                                if (matchedMod) {
                                    File targetArchiveDir = new File(hubDir, "archives/${matchedMod}")
                                    if (!targetArchiveDir.exists()) {
                                        targetArchiveDir.mkdirs()
                                    }
                                    copy {
                                        from jarFile
                                        into targetArchiveDir
                                    }
                                    println "[HUB-ARCHIVE] Successfully copied ${jarFile.name} to release hub archives: ${targetArchiveDir.canonicalPath}"
                                }
                            } catch (Exception e) {
                                println "[HUB-ARCHIVE] Note: Could not copy to release hub: ${e.message}"
                            }
                        }
                    }

                    // 3. External Vault Archive Sync
                    File vaultDir = new File("D:/Minecraft Mod Archive Jars/Item Clumps")
                    if (vaultDir.parentFile?.exists() || vaultDir.exists()) {
                        vaultDir.mkdirs()
                        copy {
                            from jarFile
                            into vaultDir
                        }
                        println "[VAULT-ARCHIVE] Successfully copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
                    }
                }
            }
        }
        build.finalizedBy(archiveTask)
    }
}
