plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "0.5.1"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Standalone Library (No JiJ)
    implementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    // Optional GUI Integration
    compileOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    runtimeOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    
    compileOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    runtimeOnly "com.terraformersmc:modmenu:18.0.0-beta.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version
    }
}

loom {
    mixin {
        defaultRefmapName = "item-clumps-refmap.json"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { String name -> name + "_" + project.archives_base_name }
    }
    manifest {
        attributes(
            'Implementation-Title': project.archives_base_name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor': 'Dasik (Rifaditya)',
            'X-Origin-Author': 'Dasik (Rifaditya)',
            'X-Origin-Repository': 'https://github.com/Rifaditya',
            'X-Origin-License': 'GNU GPLv3'
        )
    }
}

// Mod Publish Plugin Block (Only triggers if tokens are present and user asks to publish)
afterEvaluate {
    publishMods {
        file = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
        type = STABLE
        modLoaders.add("fabric")

        modrinth {
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            projectId = "item-clumps"
            minecraftVersions.add("26.1.2")
            requires {
                slug = "fabric-api"
            }
            requires {
                slug = "dasik-library"
            }
        }

        curseforge {
            accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            projectId = "item-clumps"
            minecraftVersions.add("26.1.2")
            requires {
                slug = "fabric-api"
            }
            requires {
                slug = "dasik-library"
            }
        }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Copies release JAR to local Archive and Central Release Hub'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (jarFile.exists()) {
                    // 1. Mod Local Archive
                    def mcVer = project.findProperty('minecraft_version') ?: ''
                    def localArchiveDir = file(mcVer ? "../../Archive Jar of all versions/MC ${mcVer}" : "../../Archive Jar of all versions")
                    if (localArchiveDir.exists() || localArchiveDir.parentFile?.exists()) {
                        localArchiveDir.mkdirs()
                        copy {
                            from jarFile
                            into localArchiveDir
                        }
                        println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to local Archive: ${localArchiveDir.canonicalPath}"
                    }

                    // 2. Central Release Hub Archives Sync
                    File hubCandidate = projectDir
                    File hubDir = null
                    while (hubCandidate != null) {
                        File checkDir = new File(hubCandidate, "minecraft-mod-release-hub")
                        if (checkDir.exists()) {
                            hubDir = checkDir
                            break
                        }
                        hubCandidate = hubCandidate.parentFile
                    }
                    if (hubDir == null) {
                        File fallback = new File("E:/Minecraft Project/minecraft-mod-release-hub")
                        if (fallback.exists()) hubDir = fallback
                    }
                    if (hubDir != null && hubDir.exists()) {
                        File hubConfigFile = new File(hubDir, "config/platform_projects.json")
                        if (hubConfigFile.exists()) {
                            try {
                                def hubJson = new groovy.json.JsonSlurper().parse(hubConfigFile)
                                def curPath = projectDir.canonicalPath.replace('\\', '/').toLowerCase()
                                def matchedMod = hubJson.find { name, data ->
                                    data.root_dir && curPath.contains(data.root_dir.replace('\\', '/').toLowerCase())
                                }?.key
                                if (matchedMod) {
                                    File targetArchiveDir = new File(hubDir, "archives/${matchedMod}")
                                    if (!targetArchiveDir.exists()) {
                                        targetArchiveDir.mkdirs()
                                    }
                                    copy {
                                        from jarFile
                                        into targetArchiveDir
                                    }
                                    println "[HUB-ARCHIVE] Successfully copied ${jarFile.name} to release hub archives: ${targetArchiveDir.canonicalPath}"
                                }
                            } catch (Exception e) {
                                println "[HUB-ARCHIVE] Note: Could not copy to release hub: ${e.message}"
                            }
                        }
                    }
                }
            }
        }
        build.finalizedBy(archiveTask)
    }
}
